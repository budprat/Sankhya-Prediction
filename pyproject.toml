# ABOUTME: Project manifest for astgraf, the modern Python port of the ASTGRAF.BAS /
# ABOUTME: GRAPHDO.BAS stellar-position graph suite (CLI computing CSV/JSON/SVG outputs).

[project]
name = "astgraf"
version = "0.1.0"
description = "Stellar-position period graphs: modern port of the ASTGRAF/GRAPHDO BASIC suite"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.scripts]
astgraf = "astgraf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "defusedxml>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astgraf"]
