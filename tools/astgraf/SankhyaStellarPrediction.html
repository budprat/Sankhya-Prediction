               function funGraph(ctx, axes, planetno, color, thick) 
			   {
                   var xxx, yyy, jj, x0 = axes.x0, y0, scale = axes.scale;

                   ctx.beginPath();
                   ctx.lineWidth = thick;
                   ctx.strokeStyle = color;



                   ctx.beginPath();


                   for (var i = 1; i < mxpr; i++) 
				   {

                       xxx = (i*(620/mxpr))+(10*i);
                       jj = mpr[i][planetno];

                       yyy = (Math.cos(jj*pi/180)*200)+240;


                       ctx.lineTo(xxx, yyy);



                   }
                   ctx.stroke();
               }



               function showAxes(ctx, axes) {
                   var x0 = axes.x0, w = ctx.canvas.width;
                   var y0 = axes.y0, h = ctx.canvas.height;
                   var xmin = axes.doNegativeX ? 0 : x0;
                   ctx.beginPath();
                   ctx.strokeStyle = "rgb(128,128,128)";
                   ctx.moveTo(xmin, y0);
                   ctx.lineTo(w, y0);  // X axis
                   ctx.moveTo(x0, 0);
                   ctx.lineTo(x0, h);  // Y axis
                   ctx.stroke();

                   function getXPixel(val) {
        return val*(620/mxpr)+(10*val);
    }

                   for(var i = 1; i < mxpr; i ++) {
                     ctx.fillStyle = 'white';
					ctx.fillText(i, getXPixel(i), y0 + 20);
}
               }

               function anu(abc) {
                   abc = abc - (Math.floor(abc / 360) * 360);
                   return abc;
               }


               function adx(abc) {
                   abc = abc * 180 / pi;
                   return abc;
               }


               function anx(abc) {
                   abc = Math.atan(abc / Math.sqrt(1 - abc * abc));
                   return abc;
               }


               function anq(abc) {
                   abc = Math.floor(abc) + Math.floor((abc - Math.floor(abc)) * 100 + 0.5) / 60;
                   return abc;
               }


               function anr(abc) {
                   abc = abc * pi / 180;
                   return abc;
               }


               function ans(abc) {
                   abc = Math.sin(abc * pi / 180);
                   return abc;
               }


               function anw(abc) {
                   abc = Math.floor(abc * 100 + 0.5) / 100;
                   return abc;
               }


               function anp(abc) {
                   abc = Math.sign(abc) * ((Math.abs(abc) / 3600) / 360 - Math.floor((Math.abs(abc) / 3600) / 360)) * 360;
                   return abc;

// Closure
(function() {
  /**
   * Decimal adjustment of a number.
   *
   * @param {String}  type  The type of adjustment.
   * @param {Number}  value The number.
   * @param {Integer} exp   The exponent (the 10 logarithm of the adjustment base).
   * @returns {Number} The adjusted value.
   */
  function decimalAdjust(type, value, exp) {
    // If the exp is undefined or zero...
    if (typeof exp === 'undefined' || +exp === 0) {
      return Math[type](value);
    }
    value = +value;
    exp = +exp;
    // If the value is not a number or the exp is not an integer...
    if (isNaN(value) || !(typeof exp === 'number' && exp % 1 === 0)) {
      return NaN;
    }
    // Shift
    value = value.toString().split('e');
    value = Math[type](+(value[0] + 'e' + (value[1] ? (+value[1] - exp) : -exp)));
    // Shift back
    value = value.toString().split('e');
    return +(value[0] + 'e' + (value[1] ? (+value[1] + exp) : exp));
  }

  // Decimal round
  if (!Math.round10) {
    Math.round10 = function(value, exp) {
      return decimalAdjust('round', value, exp);
    };
  }
  // Decimal floor
  if (!Math.floor10) {
    Math.floor10 = function(value, exp) {
      return decimalAdjust('floor', value, exp);
    };
  }
  // Decimal ceil
  if (!Math.ceil10) {
    Math.ceil10 = function(value, exp) {
      return decimalAdjust('ceil', value, exp);
    };
  }
})();
