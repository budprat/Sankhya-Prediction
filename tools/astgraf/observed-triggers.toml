# Observed candidate rules — status: TESTING (NU ruling 2026-08-04).
# Provenance: single-chart observations promoted for testing. NOT taught
# doctrine (doctrine-triggers.toml) and NOT mined (mined-triggers.toml —
# retired). A rule leaves this file when NU rules it doctrine, or when its
# pre-registered testing record refutes it.
#
# FRAME NOTE for site rules (Ascendant/MC): evaluate on TROPICAL site charts —
# the physical rising/culmination frame. The canon's sidereal mode shifts the
# ANGLES by ayanamsa in RA space (not ecliptic), so body-angle geometry is
# frame-dependent (Nepal: Asc-trine-real-Neptune 0.26 deg tropical vs 3.2
# sidereal). The frame-guard test pins this.

[[rule]]
name = "asc-trine-real-neptune"
description = "TESTING — site Ascendant trine real-Neptune at the event minute (Nepal 2015: 0.26 deg at the catalog minute/epicenter, 0.43 on the QUAKE chart). Site-conditional fast hand: sweeps a given site twice daily; meaningful inside loaded windows, not as a standalone claim. Tropical site charts only."
conditions = [
  { type = "trine", bodies = ["Ascendant", "real:Neptune"], orb = 1.0 },
]

[[rule]]
name = "real-uranus-trine-rahu"
description = "TESTING (NU ruling 2026-08-05) — real-Uranus trine the Rahu end (Hyderabad 2016 cast: 0.20 deg, the tightest contact in the chart; exactness +334 h). The OBSERVED end; the Ketu variant below is the untested symmetric twin. Doctrine-exact Mathcad offset."
conditions = [
  { type = "trine", bodies = ["real:Uranus", "Rahu"], orb = 1.0 },
]

[[rule]]
name = "real-uranus-trine-ketu"
description = "TESTING (NU ruling 2026-08-05) — real-Uranus trine the Ketu end: the symmetric variant of real-uranus-trine-rahu (trine is end-specific, unlike squares); no observed instance yet."
conditions = [
  { type = "trine", bodies = ["real:Uranus", "Ketu"], orb = 1.0 },
]

[[rule]]
name = "saturn-square-nodes"
description = "TESTING (NU ruling 2026-08-05) — Saturn square the nodal AXIS (one rule: a square to Rahu is a square to Ketu by axis symmetry). Hyderabad 2016 cast: 0.38 deg, exactness +77 h; era backdrop Saturn-Neptune square 0.77."
conditions = [
  { type = "square", bodies = ["Saturn", "Rahu"], orb = 1.0 },
]
